name: Render migration checks

on:
  push:
    branches: ["migration/render-postgres"]
  pull_request:
    paths:
      - "render-server/**"
      - "render.yaml"
      - "package.json"
      - "eco-point-code-20261118-0044/**"
      - ".github/workflows/render-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application dependencies
        run: npm install --omit=dev --ignore-scripts
      - name: Syntax check
        run: |
          npm run check
          find render-server eco-point-code-20261118-0044/api eco-point-code-20261118-0044/lib -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check eco-point-code-20261118-0044/public/app.js
          node --check eco-point-code-20261118-0044/public/admin/admin.js
          node --check eco-point-code-20261118-0044/public/auth-bridge.js
      - name: Verify all server imports resolve
        run: |
          node --input-type=module <<'EOF'
          import {readdir} from 'node:fs/promises';
          import {resolve} from 'node:path';
          import {pathToFileURL} from 'node:url';
          for (const dir of ['api/admin','api/public','api/student','lib']) {
            const root='eco-point-code-20261118-0044/'+dir;
            for (const name of await readdir(root)) {
              if (!name.endsWith('.js')) continue;
              await import(pathToFileURL(resolve(root,name)).href);
            }
          }
          console.log('All server modules loaded');
          EOF
