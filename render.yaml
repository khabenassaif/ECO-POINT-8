# Temporary, no-charge staging only. Free Postgres expires after 30 days.
# Do not use for real student data or production points.
services:
  - type: web
    name: eco-point-8-staging
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eco-point-8-staging-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "8"
databases:
  - name: eco-point-8-staging-db
    region: singapore
    plan: free
    databaseName: eco_point_staging
    user: eco_point_staging
