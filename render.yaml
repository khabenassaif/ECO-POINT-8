services:
  - type: web
    name: eco-point-8
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eco-point-8-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAX_UPLOAD_MB
        value: "8"
databases:
  - name: eco-point-8-db
    plan: 0.1c-256mb
    databaseName: eco_point
    user: eco_point
